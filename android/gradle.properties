# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel builds and build caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true

# Build the common device and emulator architectures so `run-android`
# does not fall back to slow ARM emulation on the Android emulator.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture — keep enabled (RN 0.85 default)
newArchEnabled=true

# Hermes JS engine — faster startup, smaller APK
hermesEnabled=true

# Edge-to-edge
edgeToEdgeEnabled=false
